name: Build iOS (unsigned ipa)

on:
  push:
    branches: [ipa]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }}
          --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }}

      - name: Pack unsigned ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry kazumi-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-ios-unsigned
          path: build/ios/ipa/kazumi-unsigned.ipa
          retention-days: 30
